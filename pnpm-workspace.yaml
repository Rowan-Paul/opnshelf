packages:
  - apps/*
  - packages/*
  - backend
overrides:
  '@tanstack/query-core': 5.100.14
  '@tanstack/react-query': 5.100.14
  react: 19.2.3
  react-dom: 19.2.3
  multer: ^2.2.0
  # Security patches for transitive dependencies (pnpm audit, 2026-09-05).
  # Each selector stays inside the major line the dependent already declares,
  # so these are patch/minor bumps only. Drop a line once the dependent's own
  # range reaches the patched version.
  'vite@7': ^7.3.6
  'undici@6': ^6.28.1
  'undici@7': ^7.29.1
  'seroval@1': ^1.6.4
  'hono@4': ^4.13.7
  '@hono/node-server@1': ^1.19.15
  'fast-uri@3': ^3.1.7
  'postcss@8': ^8.5.28
  'nanoid@5': ^5.1.16
  'nanoid@3': ^3.3.18
  'ws@8': ^8.21.3
  'shell-quote@1': ^1.10.0
  'js-yaml@4': ^4.3.2
  '@xmldom/xmldom@0.8': ^0.8.15
  '@xmldom/xmldom@0.9': ^0.9.12
  'browserslist@4': ^4.28.9
  'brace-expansion@2': ^2.1.4
  'brace-expansion@5': ^5.0.9
  'mysql2@3': ^3.24.3
  'dompurify@3': ^3.4.14
  'fflate@0.4': ^0.4.9
  'body-parser@2': ^2.3.0
  'body-parser@1': ^1.20.6
  'qs@6': ^6.16.0
  'valibot@1': ^1.4.2
  '@babel/core@7': ^7.29.1
allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  '@scarf/scarf': true
  canvas: true
  core-js: true
  esbuild: true
  prisma: true
  protobufjs: true
  lightningcss: true
  unrs-resolver: true
  msgpackr-extract: false
  '@swc/core': true
