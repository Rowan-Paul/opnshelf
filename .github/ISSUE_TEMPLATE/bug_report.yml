name: Bug report
description: Report broken behavior, a regression, or a reliability problem.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search open and closed issues first. Keep the report focused on one problem and redact secrets or private paths.

  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Describe the problem and what it prevented you from doing.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How did you encounter it?
      description: Share the steps leading up to the problem. If it only happens sometimes or you cannot reproduce it, say so and describe what you remember.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      description: Select every place where you have observed the problem. You do not need to test the others.
      multiple: true
      options:
        - Web App
        - Mobile App — iOS
        - Mobile App — Android
        - Backend
        - API client or lexicons
        - Mail relay
        - Build, deployment, or CI
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Additional context (optional)
      description: Include anything you know about the page or route, production / Staging / local development, sign-in state, device, OS, browser, Mobile App version, or commit. Mention any workaround here too.
      placeholder: Web App on opnshelf.xyz, Search page, signed in, Safari on iPhone.

  - type: textarea
    id: evidence
    attributes:
      label: Evidence (optional)
      description: Add the smallest useful logs, stack traces, screenshots, or recordings. Redact secrets and private paths.
