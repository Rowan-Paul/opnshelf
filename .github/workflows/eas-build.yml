name: EAS Build

# Manual only: kick off cloud builds from the Actions tab. Keeping this off the
# PR/push path avoids burning EAS build minutes on every mobile change.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        required: true
        default: all
        options:
          - all
          - ios
          - android
      profile:
        description: EAS build profile (see apps/mobile/eas.json)
        type: choice
        required: true
        default: preview
        options:
          - development
          - preview
          - production
      submit:
        description: Submit to the stores after a successful production build
        type: boolean
        required: false
        default: false

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: "pnpm"

      - name: Setup EAS
        uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # 9.0.1
        with:
          eas-version: "25.3.0"
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      # --auto-submit (production only) submits straight after the build using the
      # matching submit profile and implies --wait, so there is no race with a
      # separate submit step. Plain builds use --no-wait and finish in EAS cloud.
      - name: Build
        env:
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          EXPO_ASC_APP_ID: ${{ secrets.EXPO_ASC_APP_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}
        run: |
          if [ "${{ github.event.inputs.submit }}" = "true" ] && [ "${{ github.event.inputs.profile }}" = "production" ]; then
            eas build \
              --non-interactive \
              --platform ${{ github.event.inputs.platform }} \
              --profile production \
              --auto-submit
          else
            eas build \
              --non-interactive \
              --no-wait \
              --platform ${{ github.event.inputs.platform }} \
              --profile ${{ github.event.inputs.profile }}
          fi
