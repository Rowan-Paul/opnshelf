name: EAS Build

# Manual only: kick off cloud builds from the Actions tab. Keeping this off the
# PR/push path avoids burning EAS build minutes on every mobile change.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        required: true
        default: all
        options:
          - all
          - ios
          - android
      profile:
        description: EAS build profile (see apps/mobile/eas.json)
        type: choice
        required: true
        default: preview
        options:
          - development
          - preview
          - production
      submit:
        description: Submit to the stores after a successful production build
        type: boolean
        required: false
        default: false

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      # Android submit reads ./google-service-account.json (gitignored). Decode it
      # from the base64 secret so --auto-submit can reach the Play Store.
      - name: Write Google service account key
        if: ${{ github.event.inputs.submit == 'true' && github.event.inputs.profile == 'production' }}
        run: echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_BASE64 }}" | base64 --decode > google-service-account.json

      # --auto-submit (production only) submits straight after the build using the
      # matching submit profile and implies --wait, so there is no race with a
      # separate submit step. Plain builds use --no-wait and finish in EAS cloud.
      - name: Build
        env:
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          EXPO_ASC_APP_ID: ${{ secrets.EXPO_ASC_APP_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}
        run: |
          if [ "${{ github.event.inputs.submit }}" = "true" ] && [ "${{ github.event.inputs.profile }}" = "production" ]; then
            eas build \
              --non-interactive \
              --platform ${{ github.event.inputs.platform }} \
              --profile production \
              --auto-submit
          else
            eas build \
              --non-interactive \
              --no-wait \
              --platform ${{ github.event.inputs.platform }} \
              --profile ${{ github.event.inputs.profile }}
          fi
