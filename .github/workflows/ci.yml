name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# dorny/paths-filter reads the changed files of a pull request through the API.
permissions:
  contents: read

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      lighthouse_server: ${{ steps.filter.outputs.lighthouse_server }}
      lighthouse: ${{ steps.filter.outputs.lighthouse }}
      web: ${{ steps.filter.outputs.web }}
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      api: ${{ steps.filter.outputs.api }}
      scripts: ${{ steps.filter.outputs.scripts }}
      privacy_reference: ${{ steps.filter.outputs.privacy_reference }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            scripts:
              - 'scripts/**'
              - 'package.json'
              - '.github/workflows/**'
            privacy_reference:
              - 'backend/src/privacy/**'
              - 'backend/src/auth/oauth-scopes*'
              - 'backend/scripts/privacy-reference-smoke.ts'
              - 'spaces/**'
              - 'lexicons/xyz/opnshelf/core.json'
              - 'scripts/privacy-reference.mjs'
              - 'scripts/reference-plc.mjs'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            lighthouse_server:
              - 'services/lighthouse/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            lighthouse:
              - 'apps/web/**'
              - 'packages/**'
              - 'backend/openapi.json'
              - 'scripts/lighthouse*'
              - 'scripts/ui-scenarios.mjs'
              - 'scripts/dev-session.mjs'
              - 'lighthouserc.cjs'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - 'scripts/check-identity-tls.mjs'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            mobile:
              - 'apps/mobile/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            api:
              - 'backend/**'
              - 'packages/api/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'

  scripts:
    needs: changes
    if: ${{ needs.changes.outputs.scripts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Check workflow syntax and expressions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -shellcheck= .github/workflows/ci.yml .github/workflows/tranquil-image.yml
      - name: Check script syntax
        run: |
          for file in scripts/*.mjs scripts/*.cjs; do node --check "$file"; done
      - name: Test repository scripts
        run: node --test scripts/*.test.cjs scripts/*.test.mjs

  privacy-reference:
    needs: changes
    if: ${{ needs.changes.outputs.privacy_reference == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - name: Reference Spaces OAuth and record round trips
        run: pnpm test:privacy-reference

  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter "./apps/web" run check

      - name: Typecheck
        run: pnpm --filter "./apps/web" exec tsc --noEmit

      - name: Test
        run: pnpm --filter "./apps/web" run test

  lighthouse-server:
    name: Lighthouse server
    needs: changes
    if: ${{ needs.changes.outputs.lighthouse_server == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: "npm"
          cache-dependency-path: services/lighthouse/package-lock.json
      - run: npm --prefix services/lighthouse ci
      - run: npm --prefix services/lighthouse test
      - name: Build the deploy image
        run: docker build --file services/lighthouse/Dockerfile --tag opnshelf-lighthouse:test .
      - name: Check the running deploy image
        run: |
          container_id=$(docker run --detach --rm --publish 127.0.0.1:9001:9001 --tmpfs /data --env LHCI_BASIC_AUTH_PASSWORD=ci-integration-fixture-only-123456789 opnshelf-lighthouse:test)
          trap 'docker logs "$container_id"; docker stop "$container_id" >/dev/null' EXIT
          curl --fail --retry 20 --retry-all-errors --retry-connrefused --retry-delay 1 http://127.0.0.1:9001/healthz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:9001/app/)" = 401

  lighthouse:
    name: Authenticated Lighthouse
    needs: changes
    if: ${{ needs.changes.outputs.lighthouse == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Chrome and Linux dependencies
        env:
          PUPPETEER_CACHE_DIR: ${{ runner.temp }}/puppeteer
        run: |
          sudo env "PUPPETEER_CACHE_DIR=$PUPPETEER_CACHE_DIR" \
            "$(command -v node)" node_modules/puppeteer/lib/cjs/puppeteer/node/cli.js \
            browsers install chrome --install-deps
      - name: Audit populated signed-in pages
        env:
          PUPPETEER_CACHE_DIR: ${{ runner.temp }}/puppeteer
        run: pnpm test:lighthouse
      - name: Upload reports to the protected dashboard
        # Fork PRs retain local artifacts but receive no upload credentials.
        if: ${{ vars.LHCI_SERVER_URL != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          LHCI_SERVER_URL: ${{ vars.LHCI_SERVER_URL }}
          LHCI_BUILD_TOKEN: ${{ secrets.LHCI_BUILD_TOKEN }}
          LHCI_BASIC_AUTH_USERNAME: ${{ vars.LHCI_BASIC_AUTH_USERNAME }}
          LHCI_BASIC_AUTH_PASSWORD: ${{ secrets.LHCI_BASIC_AUTH_PASSWORD }}
        run: pnpm exec lhci upload
      - name: Retain Lighthouse HTML and JSON reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-authenticated
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: opnshelf_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opnshelf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/opnshelf_test
      WATCH_PRIVACY_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/opnshelf_test
      TRAKT_SYNC_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/opnshelf_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify identity TLS certificate rejection
        run: node scripts/check-identity-tls.mjs

      - name: Prisma generate
        run: pnpm --filter backend exec prisma generate

      - name: Lint and Format Check
        run: pnpm --filter backend run check

      - name: Typecheck
        run: pnpm --filter backend exec tsc --noEmit

      - name: Apply migrations to disposable test database
        run: pnpm --filter backend exec prisma migrate deploy

      - name: Test
        run: pnpm --filter backend run test

      - name: Build
        run: pnpm --filter backend run build

  mobile:
    needs: changes
    if: ${{ needs.changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter mobile run check

      - name: Typecheck
        run: pnpm --filter mobile exec tsc --noEmit

      - name: Test
        run: pnpm --filter mobile run test

  api:
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter backend exec prisma generate

      - name: Generate API artifacts
        run: pnpm generate:api

      - name: Check API artifact drift
        run: git diff --exit-code -- backend/openapi.json packages/api/src/generated

      - name: Typecheck
        run: pnpm --filter @opnshelf/api exec tsc --noEmit

  ci:
    name: CI result
    needs: [changes, web, backend, mobile, api, scripts, privacy-reference, lighthouse, lighthouse-server]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LIGHTHOUSE_SERVER_RESULT: ${{ needs.lighthouse-server.result }}
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse.result }}
          WEB_RESULT: ${{ needs.web.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
          API_RESULT: ${{ needs.api.result }}
          SCRIPTS_RESULT: ${{ needs.scripts.result }}
          REFERENCE_RESULT: ${{ needs.privacy-reference.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Changes job result: $CHANGES_RESULT"
            exit 1
          fi

          for result in "$LIGHTHOUSE_SERVER_RESULT" "$LIGHTHOUSE_RESULT" "$WEB_RESULT" "$BACKEND_RESULT" "$MOBILE_RESULT" "$API_RESULT" "$SCRIPTS_RESULT" "$REFERENCE_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "Unexpected application job result: $result"
                exit 1
                ;;
            esac
          done
