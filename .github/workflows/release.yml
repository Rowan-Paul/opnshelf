name: Release notes

# `main` is release-only (ADR 0021), so every push to it is a release. This
# publishes a GitHub release for that push, tagged with the date, with the
# commit subjects that just went from staging to production as the body.
#
# ponytail: commit subjects, not PR titles. Work lands as direct commits on
# `develop`, so GitHub's own --generate-notes (which lists merged PRs only)
# would come back near-empty. Switch to `gh release create --generate-notes`
# plus a .github/release.yml label config once every change goes through a
# labelled PR.
#
# The tag follows the mobile app version in `apps/mobile/app.config.ts`, which
# is the one version anyone outside the repo sees (it is also the OTA runtime
# version, policy `appVersion`). Backend and web have no meaningful version.
# Releases that ship without an app-version bump get a counter: v1.0.0, then
# v1.0.0.2, v1.0.0.3. Bump `version` in app.config.ts and the next release is
# v1.1.0.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          app_version=$(grep -m1 -oE 'version: "[0-9]+\.[0-9]+\.[0-9]+"' \
            apps/mobile/app.config.ts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$app_version" ]; then
            echo "No app version found in apps/mobile/app.config.ts" >&2
            exit 1
          fi

          existing=$(git tag -l "v$app_version" "v$app_version.*" | wc -l | tr -d ' ')
          tag="v$app_version"
          if [ "$existing" -gt 0 ]; then tag="v$app_version.$((existing + 1))"; fi

          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          range="${prev:+$prev..}HEAD"
          echo "Tag $tag, notes range $range"

          git log --no-merges --reverse --pretty='- %s' "$range" > notes.md
          gh release create "$tag" --title "$tag" --notes-file notes.md \
            --target "$GITHUB_SHA"
