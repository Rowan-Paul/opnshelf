name: Release

# `main` is release-only (ADR 0021), so every push to it is a release. This
# publishes a GitHub release for that push, with the commit subjects that just
# went from staging to production as the body, and kicks off a store build when
# the mobile app version changed.
#
# ponytail: commit subjects, not PR titles. Work lands as direct commits on
# `develop`, so GitHub's own --generate-notes (which lists merged PRs only)
# would come back near-empty. Switch to `gh release create --generate-notes`
# plus a .github/release.yml label config once every change goes through a
# labelled PR.
#
# Tags are always three-part semver. The tag is whichever is higher: the mobile
# app version in `apps/mobile/app.config.ts`, or the newest existing tag with
# its patch bumped. So web and backend releases walk v1.0.1, v1.0.2, and a bump
# of the app version to 1.1.0 lands exactly on v1.1.0.
#
# That means the app version should move by minor, not patch. Setting it to
# 1.0.1 while the repo has already released v1.0.3 leaves the tag at v1.0.4:
# never wrong, never stuck, but no longer equal to the app version.
#
# A store build is triggered by the app version changing since the previous
# release, read straight out of app.config.ts at both tags. Web and backend
# releases never burn build minutes.
on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The app version as of a given ref, or of the working tree when
          # called with no argument.
          app_version_at() {
            if [ -n "$1" ]; then
              git show "$1:apps/mobile/app.config.ts" 2>/dev/null || true
            else
              cat apps/mobile/app.config.ts
            fi | grep -m1 -oE 'version: "[0-9]+\.[0-9]+\.[0-9]+"' \
               | grep -oE '[0-9]+\.[0-9]+\.[0-9]+'
          }

          app_version=$(app_version_at)
          if [ -z "$app_version" ]; then
            echo "No app version found in apps/mobile/app.config.ts" >&2
            exit 1
          fi

          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          prev_app_version=$(app_version_at "$prev")

          # Unknown previous version means skip the build rather than guess one
          # into existence.
          new_app_version=false
          if [ -n "$prev_app_version" ] && [ "$app_version" != "$prev_app_version" ]; then
            new_app_version=true
          fi
          echo "new_app_version=$new_app_version" >> "$GITHUB_OUTPUT"

          # Highest of the app version and the newest tag's patch + 1, so the
          # tag is always three-part and always moves forward.
          newest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' | sort -V | tail -1)
          bumped="$app_version"
          if [ -n "$newest" ]; then
            bumped=$(echo "$newest" | awk -F. '{print $1"."$2"."$3 + 1}')
          fi
          tag="v$(printf '%s\n%s\n' "$app_version" "$bumped" | sort -V | tail -1)"

          range="${prev:+$prev..}HEAD"
          echo "Tag $tag, app $prev_app_version -> $app_version, notes range $range"

          git log --no-merges --reverse --pretty='- %s' "$range" > notes.md
          gh release create "$tag" --title "$tag" --notes-file notes.md \
            --target "$GITHUB_SHA"

      # ponytail: dispatch the existing manual workflow instead of repeating its
      # EAS setup and secret handling here. It runs as its own job, so a flaky
      # EAS build does not turn the release run red. workflow_dispatch is one of
      # the two events GITHUB_TOKEN is allowed to trigger.
      - name: Build and submit the store release
        if: steps.publish.outputs.new_app_version == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run eas-build.yml --ref main \
            -f platform=all -f profile=production -f submit=true
