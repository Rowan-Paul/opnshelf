name: Release

# `main` is release-only (ADR 0021), so every push to it is a release. This
# publishes a GitHub release for that push, with the commit subjects that just
# went from staging to production as the body, and kicks off a store build when
# the mobile app version changed.
#
# ponytail: commit subjects, not PR titles. Work lands as direct commits on
# `develop`, so GitHub's own --generate-notes (which lists merged PRs only)
# would come back near-empty. Switch to `gh release create --generate-notes`
# plus a .github/release.yml label config once every change goes through a
# labelled PR.
#
# The release version IS the mobile app version in `apps/mobile/app.config.ts`,
# always, so `v1.1.0` on GitHub and 1.1.0 in the stores are the same thing. The
# release fails if that version was not bumped since the last one, which is the
# only way to keep the two equal without CI committing to `main` behind your
# back. Bump it on `develop`; nothing happens until the merge lands here.
#
# Every release therefore ships a store build, including one that only touched
# web or backend. That is the price of the versions matching: no free releases,
# and each one waits on store review.
on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The app version as of a given ref, or of the working tree when
          # called with no argument.
          app_version_at() {
            if [ -n "$1" ]; then
              git show "$1:apps/mobile/app.config.ts" 2>/dev/null || true
            else
              cat apps/mobile/app.config.ts
            fi | grep -m1 -oE 'version: "[0-9]+\.[0-9]+\.[0-9]+"' \
               | grep -oE '[0-9]+\.[0-9]+\.[0-9]+'
          }

          app_version=$(app_version_at)
          if [ -z "$app_version" ]; then
            echo "No app version found in apps/mobile/app.config.ts" >&2
            exit 1
          fi

          # The release version is the app version, with nothing in between to
          # let them drift. Refusing here, before anything is published, is what
          # keeps them equal - the alternative is CI committing a bump to `main`
          # and `develop` inheriting a divergence it never asked for.
          tag="v$app_version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists. Bump version in \
          apps/mobile/app.config.ts on develop, then merge again."
            exit 1
          fi

          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          range="${prev:+$prev..}HEAD"
          echo "Tag $tag, app version $app_version, notes range $range"

          git log --no-merges --reverse --pretty='- %s' "$range" > notes.md
          gh release create "$tag" --title "$tag" --notes-file notes.md \
            --target "$GITHUB_SHA"

      # Unconditional: a release cannot get this far without a new app version,
      # because the step above refuses to publish one that reuses a tag.
      #
      # ponytail: dispatch the existing manual workflow instead of repeating its
      # EAS setup and secret handling here. It runs as its own job, so a flaky
      # EAS build does not turn the release run red. workflow_dispatch is one of
      # the two events GITHUB_TOKEN is allowed to trigger.
      - name: Build and submit the store release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run eas-build.yml --ref main \
            -f platform=all -f profile=production -f submit=true
