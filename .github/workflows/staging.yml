name: Staging

# The same two routes as the production release (ADR 0021), aimed at the
# `preview` channel instead. `version` in `apps/mobile/app.config.ts` picks:
#
#   not bumped  -> OTA update on the preview channel. Next app launch.
#   bumped      -> internal-distribution preview build. Sideload it.
#
# Exclusive for the same reason as production: the runtime version policy is
# `appVersion`, so an update published after a bump targets a runtime no
# installed preview binary has. It only lands while the version sits still.
#
# EAS Build on the free plan allows 15 builds per platform per month and the
# same bump builds production again when it reaches `main`, so a bump costs two
# of them. Updates are unlimited, so the OTA path is the cheap one by a mile.
on:
  push:
    branches: [develop]
    paths:
      - "apps/mobile/**"
      - "packages/**"

# A run only matters until the next push replaces it.
concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      update: ${{ steps.decide.outputs.update }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide what staging needs
        id: decide
        run: |
          set -euo pipefail

          app_version_at() {
            { git show "$1:apps/mobile/app.config.ts" 2>/dev/null \
              | grep -m1 -oE 'version: "[0-9]+\.[0-9]+\.[0-9]+"' \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+'
            } || true
          }

          # A force push or a fresh branch leaves no usable range, and guessing
          # one would either build nothing or rebuild everything.
          prev="${{ github.event.before }}"
          if ! git cat-file -e "$prev^{commit}" 2>/dev/null; then
            echo "No previous commit to compare against, skipping"
            prev=""
          fi

          build=false
          update=false
          if [ -n "$prev" ]; then
            if [ "$(app_version_at "$prev")" != "$(app_version_at HEAD)" ]; then
              build=true
            else
              update=true
            fi
          fi

          echo "Range ${prev:-none}..HEAD, build=$build update=$update"
          {
            echo "build=$build"
            echo "update=$update"
          } >> "$GITHUB_OUTPUT"

      # ponytail: same dispatch trick as the release workflow. `preview` is
      # internal distribution, so there is nothing to submit.
      - name: Build a new preview binary
        if: steps.decide.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run eas-build.yml --ref develop \
            -f platform=all -f profile=preview -f submit=false

  update:
    needs: route
    if: ${{ needs.route.outputs.update == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup EAS
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      # `eas update` does not read `build.preview.env` from eas.json, and
      # EXPO_PUBLIC_* values are inlined into the bundle as it is published, so
      # an update that does not carry them ships a bundle where those features
      # are switched off - silently, since nothing fails.
      #
      # These were duplicated here by hand until the Google client ids went into
      # eas.json and not into the copy, and staging lost its Google button. So
      # read eas.json instead: one source of truth, and it is the one in git.
      #
      # Not `--environment preview`: the EAS "preview" environment has
      # EXPO_PUBLIC_API_URL pointing at the *production* API. Builds are unhurt
      # because build.preview.env wins over it, but an update resolved from that
      # environment would write to production, which per ADR 0021 is real data.
      - name: Load the preview environment from eas.json
        run: |
          node -e "
            const env = require('./apps/mobile/eas.json').build.preview.env ?? {};
            const lines = Object.entries(env)
              .filter(([k]) => k.startsWith('EXPO_PUBLIC_'))
              .map(([k, v]) => k + '=' + v);
            if (!lines.length) {
              console.error('No EXPO_PUBLIC_* found in build.preview.env');
              process.exit(1);
            }
            console.log(lines.join('\\n'));
          " | tee -a "$GITHUB_ENV"

      - name: Publish the update
        # No --non-interactive: `eas update` hands it to `expo export`, which
        # rejects it and tells you to set CI instead. Actions already sets
        # CI=true on every step, so the flag was only ever noise in the log.
        run: |
          eas update \
            --channel preview \
            --message "${{ github.sha }}"
