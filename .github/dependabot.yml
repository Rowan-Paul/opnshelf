# Keeps the SHA-pinned GitHub Actions in .github/workflows current. Only the
# github-actions ecosystem is covered: npm updates are handled by hand because
# the pnpm workspace carries overrides and a Dependabot feed would be noise.
#
# Version-update pull requests target `develop`: `main` is release-only and
# every push to it deploys production (AGENTS.md, ADR 0021), so a bump lands
# there with the next release instead of as its own release. Dependabot
# security updates ignore `target-branch` and still open against `main`;
# retarget those by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "Update GitHub Actions"
