<!-- @dsCard group="Overlays" height=96 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Tooltip</title></head>
<body>
<div id="root" class="ds-row" style="padding:32px 16px"></div>
<script>
  var O = window.Opnshelf, I = O.icons, h = React.createElement, F = React.Fragment;
  var view = h(F, null,
    h(O.Tooltip, null,
      h(O.TooltipTrigger, { asChild: true }, h(O.Button, { variant: 'outline', size: 'icon', 'aria-label': 'Add to shelf' }, h(I.Plus))),
      h(O.TooltipContent, null, 'Add to shelf')),
    h(O.Tooltip, null,
      h(O.TooltipTrigger, { asChild: true }, h(O.Button, { variant: 'outline', size: 'icon', 'aria-label': 'Add to list' }, h(I.ListPlus))),
      h(O.TooltipContent, { side: 'bottom' }, 'Add to list')),
    h('span', { style: { fontSize: 14, color: 'var(--foreground-muted)' } }, 'Hover or focus a button.'));
  ReactDOM.createRoot(document.getElementById('root')).render(view);
</script>
</body>
</html>
