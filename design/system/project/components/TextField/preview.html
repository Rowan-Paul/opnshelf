<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TextField</title>
</head>
<body>
<div class="ds-row" style="align-items:flex-start">
  <div class="field" style="width:280px">
    <label class="field-label" for="tf-title">Title</label>
    <input class="input" id="tf-title" placeholder="Give your review a title">
    <span class="field-hint">Keep titles spoiler-free.</span>
  </div>
  <div class="field" style="width:280px">
    <label class="field-label" for="tf-list">List name</label>
    <input class="input" id="tf-list" value="Rainy Sunday rewatches">
  </div>
  <div class="field" style="width:280px">
    <label class="field-label" for="tf-pass">Password</label>
    <input class="input" id="tf-pass" placeholder="At least 8 characters" style="border-color:var(--destructive)">
    <span class="field-error">Use at least 8 characters.</span>
  </div>
</div>
<div class="ds-row">
  <textarea class="input" rows="2" style="width:584px;resize:none" placeholder="Describe your issue or idea..."></textarea>
</div>
</body>
</html>
