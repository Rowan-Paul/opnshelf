<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Opnshelf</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--background); color:var(--foreground); font-family:var(--font-display); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .shelf { fill:var(--foreground); }
  .amber { fill:var(--accent-600); }
  .wash { fill:var(--accent-muted); }
  .board { fill:var(--background-strong); }
  .cut { fill:var(--background); }
  .ink { fill:var(--foreground); }
  .onamber { fill:var(--accent-foreground); }
  .blk { rx:var(--radius-lg); }
  .tile { rx:var(--radius-sm); }
  .words { position:absolute; left:24px; bottom:24px; max-width:440px; }
  .name { margin:0; font-size:88px; line-height:.95; font-weight:700; letter-spacing:-.03em; color:var(--foreground); }
  .tag { margin:8px 0 0 3px; font-family:var(--font-sans); font-size:14px; line-height:20px; color:var(--foreground-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      foreground 208x200 bled off the top (Slate Ink in light, Paper in dark, as the mark does) · accent-600 128x240 bleeding off the right edge (Screen Amber, never recolored) · accent-muted 112x136 (the wash) · background-strong 336x64 (the shelf board) — about 37% of 960x288
  arrangement one ink slab and one amber slab standing on a long low board, the wash between them; space-4 gutters, everything right of x = 480
  pattern     tiles cut by the radius tokens, from the mark's "amber media tile on the shelf": twelve 2:3 poster tiles in shelf rows, cut from the slab in background, one of them amber
  scales      tiles space-8 x space-12 at a 44px pitch; gutters space-4; block corners radius-lg, tile corners radius-sm
-->
<rect class="shelf blk" x="16" y="-16" width="208" height="200" rx="16"/>
<rect class="wash blk" x="240" y="48" width="112" height="136" rx="16"/>
<rect class="amber blk" x="368" y="24" width="128" height="240" rx="16"/>
<rect class="board blk" x="16" y="200" width="336" height="64" rx="16"/>
<rect class="cut tile" x="40" y="24" width="32" height="48" rx="6"/>
<rect class="cut tile" x="84" y="24" width="32" height="48" rx="6"/>
<rect class="cut tile" x="128" y="24" width="32" height="48" rx="6"/>
<rect class="cut tile" x="172" y="24" width="32" height="48" rx="6"/>
<rect class="cut tile" x="40" y="96" width="32" height="48" rx="6"/>
<rect class="cut tile" x="84" y="96" width="32" height="48" rx="6"/>
<rect class="amber tile" x="128" y="96" width="32" height="48" rx="6"/>
<rect class="cut tile" x="172" y="96" width="32" height="48" rx="6"/>
<rect class="ink tile" x="256" y="120" width="32" height="48" rx="6"/>
<rect class="ink tile" x="300" y="120" width="32" height="48" rx="6"/>
<rect class="onamber tile" x="384" y="200" width="32" height="48" rx="6"/>
<rect class="onamber tile" x="428" y="200" width="32" height="48" rx="6"/>
</svg>
</div>
<div class="words">
<h1 class="name">Opnshelf</h1>
<p class="tag">Track what you watch and discover what others are watching.</p>
</div>
</div>
</body>
</html>
