services:
  tab:
    image: fatfingers23/tab:latest
    ports:
      - "2480:2480"
    environment:
      - TAB_ADMIN_PASSWORD=${TAB_ADMIN_PASSWORD:-${TAP_ADMIN_PASSWORD:-y29d6b572f17af0f150cd4b480bec85cf}}
      - TAB_COLLECTION_FILTERS=xyz.opnshelf.*
    volumes:
      - tab-data:/data
    depends_on:
      - opnshelf-postgres

  # TMDB response cache (ADR 0041). Optional: leave REDIS_URL unset in
  # backend/.env and the backend falls back to its in-memory cache.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  opnshelf-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: opnshelf
      POSTGRES_PASSWORD: opnshelf
      POSTGRES_DB: opnshelf
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  tab-data:
  postgres-data:
  redis-data:
