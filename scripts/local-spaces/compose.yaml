name: opnshelf-spaces-local
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - database:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30
  plc:
    image: ghcr.io/bluesky-social/did-method-plc:plc-f2ab7516bac5bc0f3f86842fa94e996bd1b3815b
    platform: linux/amd64
    environment:
      DB_CREDS_JSON: '{"username":"postgres","host":"db","port":5432,"database":"plc"}'
      DB_MIGRATE_CREDS_JSON: '{"username":"postgres","host":"db","port":5432,"database":"plc"}'
      ENABLE_MIGRATIONS: 'true'
      PORT: '2582'
    ports:
      - '127.0.0.1:2582:2582'
    depends_on:
      db:
        condition: service_healthy
  mail:
    image: axllent/mailpit:v1.29.2
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'
  gateway:
    image: haproxy:3.2-alpine
    ports:
      - '127.0.0.1:443:443'
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
  tab:
    image: fatfingers23/tab:latest
    network_mode: host
    environment:
      TAB_BIND: 127.0.0.1:2481
      TAB_PLC_URL: http://127.0.0.1:2582
      TAB_RELAY_URL: https://pds.127.0.0.1.nip.io
      TAB_COLLECTION_FILTERS: xyz.opnshelf.*
      TAB_DATABASE_URL: sqlite:///data/tab.db
      SSL_CERT_FILE: /certs/pds.pem
    volumes:
      - tab:/data
      - ${OPNSHELF_SPACES_STATE_DIR:?Run through the local Spaces script}/pds.pem:/certs/pds.pem:ro

volumes:
  database:
  tab:
